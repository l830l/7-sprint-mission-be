plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.11'
    id 'io.spring.dependency-management' version '1.1.7'
}

ext {
    queryDslVersion = "5.1.0"
}


group = 'com.sprint.mission'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // QueryDSL
    implementation "com.querydsl:querydsl-jpa:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${queryDslVersion}:jakarta"

    // ⚠️ annotationProcessor에도 persistence-api 추가
    annotationProcessor "jakarta.persistence:jakarta.persistence-api:3.1.0"

    // jakarta (Spring Boot 3 필수)
    implementation "jakarta.annotation:jakarta.annotation-api"
    implementation "jakarta.persistence:jakarta.persistence-api"


    // Caffeine Cache
    implementation "com.github.ben-manes.caffeine:caffeine:3.1.8"

    // Apache Commons Lang 최신 버전 강제
    implementation 'org.apache.commons:commons-lang3:3.19.0'

    // CVE 대응용 constraints (하위 라이브러리 버전 덮어쓰기)
    constraints {
        implementation('org.apache.commons:commons-lang3:3.19.0')
    }

    // Swagger/OpenAPI 추가
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'


    // 테스트 시에도 Lombok 사용
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    //S3 연동 : AWS SDK for Java
    implementation platform('software.amazon.awssdk:bom:2.20.56')
    implementation 'software.amazon.awssdk:s3'

    // env
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'
}

// QueryDSL: QClass 생성 폴더
def generatedDir = layout.buildDirectory.dir("generated/sources/annotationProcessor/java/main").get().asFile

// QueryDSL: compileJava 설정
tasks.named('compileJava') {
    options.annotationProcessorGeneratedSourcesDirectory = generatedDir
}

// QueryDSL: QClass 경로를 main 소스에 추가
sourceSets {
    main {
        java {
            srcDirs += generatedDir
        }
    }
}


tasks.named('test') {
    useJUnitPlatform()
}



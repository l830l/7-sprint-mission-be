server:
  port: 80

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234

  mail:
    username: ${MAIL_ID}
    password: ${MAIL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
    sql:
      init:
        mode: never
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ${AWS_REGION}
      s3:
        bucket: ${AWS_S3_BUCKET}

discodeit:
  storage:
    type: s3
    s3:
      path: binary
  admin:
    email: ${ADMIN_EMAIL}
    nickname: ${ADMIN_NICKNAME}
    password: ${ADMIN_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-seconds: 1800 # 30minute
    refresh-token-expiration-seconds: 1209600 # 14days
    refresh-cookie:
      name: REFRESH_TOKEN
      path: /api/auth/refresh
      http-only: true
      secure: true
      same-site: Strict # Best String Value: Strict, Lax, None

logging:
  level:
    root: INFO
    com.sprint.mission.discodeit: INFO

management:
  endpoint:
    health:
      show-details: never
      show-components: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: false